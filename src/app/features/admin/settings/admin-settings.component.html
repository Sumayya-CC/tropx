<app-page-header
  title="Settings"
  subtitle="Manage your business configuration">
</app-page-header>


<div class="settings-tabs">
  <button type="button"
    class="settings-tab"
    [class.active]="activeTab() === 'business'"
    (click)="setActiveTab('business')">
    Business
  </button>
  <button type="button"
    class="settings-tab"
    [class.active]="activeTab() === 'ordering'"
    (click)="setActiveTab('ordering')">
    Ordering
  </button>
  <button type="button"
    class="settings-tab"
    [class.active]="activeTab() === 'storefront'"
    (click)="setActiveTab('storefront')">
    Storefront
  </button>
  <button type="button"
    class="settings-tab"
    [class.active]="activeTab() === 'invoice'"
    (click)="setActiveTab('invoice')">
    Invoice
  </button>
  <button type="button"
    class="settings-tab"
    [class.active]="activeTab() === 'notifications'"
    (click)="setActiveTab('notifications')">
    Notifications
  </button>
  <button type="button"
    class="settings-tab"
    [class.active]="activeTab() === 'system'"
    (click)="setActiveTab('system')">
    System
  </button>
</div>

<div class="settings-page">

  @if (activeTab() === 'business') {
    <div class="tab-panel">
      <app-business-info-card />
    </div>
  }



  @if (activeTab() === 'invoice') {
    <div class="tab-panel">
      <app-invoice-settings-card />
    </div>
  }

  @if (activeTab() === 'ordering') {
    <div class="tab-panel">
      <app-ordering-defaults-card />
      <app-delivery-options-card />
      <app-payment-methods-card />
      <app-stock-backorder-card />
      <app-minimum-order-card />
      <app-closure-card />
    </div>
  }


  @if (activeTab() === 'storefront') {
    <div class="tab-panel">

      <app-featured-banner-card />

      <app-home-sections-card />
      <app-gallery-card />
      <app-popular-products-card />

    </div>
  }

  @if (activeTab() === 'notifications') {
    <div class="tab-panel">
      <app-notifications-card />
    </div>
  }

  @if (activeTab() === 'system') {
    <div class="tab-panel">
      <app-reconciliation-card />
      <app-shop-link-card />
      <app-shop-health-card />
      <app-pipeline-card />
      <app-routing-card />
      <app-expenses-card />
    </div>
  }


</div>
